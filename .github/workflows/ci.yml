name: CI

on:
  pull_request:
    branches: [main, testnet, stabilisation]
  push:
    branches: [main, testnet, stabilisation]

jobs:
  # Lint is not run here yet: `bun run lint` reports 251 errors on
  # stabilisation, so it would fail every PR until that backlog is cleared.

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run type-check
      - run: bun run test:release

  consensus-tests:
    name: Consensus Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:consensus
