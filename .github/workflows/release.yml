name: Release

# Builds a tagged release twice from clean checkouts and publishes the image
# only when both builds produce the same manifest digest. The tag must carry
# a signature from a key listed in .github/allowed_signers as it stands on
# the protected release branch, and the tagged commit must be reachable from
# that branch. A final release (no pre-release suffix, or the FINAL_RELEASE
# repository variable) also needs REQUIRED_RELEASE_SIGNERS holders in that
# list. The signer list is never read from the tag itself, so pushing
# a tag cannot grant signing rights. Every job checks out the exact commit
# the signature was verified on, so a tag moved while the workflow runs
# cannot change what gets built or published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kynesyslabs/node
  # Branch protection on this branch is what the release trust rests on:
  # it supplies the signer list and bounds which commits may be released.
  RELEASE_BRANCH: stabilisation
  # A final release must not hinge on one person's key: losing it stops
  # releases, and one stolen key ships anything. Release candidates are exempt
  # so they keep moving while the other holders are onboarded.
  REQUIRED_RELEASE_SIGNERS: 3
  FINAL_RELEASE: ${{ vars.FINAL_RELEASE }}

jobs:
  verify-tag:
    name: Tag signature
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify the signed, annotated tag against the protected signers
        id: verify
        run: |
          # checkout may have flattened the tag; fetch the real tag object
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch --no-tags origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || {
            echo "::error::$GITHUB_REF_NAME is not an annotated tag; sign it with git tag -s"; exit 1; }
          sha=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          # a tag on an unmerged branch has not been through review
          git merge-base --is-ancestor "$sha" "origin/$RELEASE_BRANCH" || {
            echo "::error::$sha is not on $RELEASE_BRANCH; merge it before tagging"; exit 1; }
          # the signer list comes from the protected branch, not from the tag
          signers="$RUNNER_TEMP/allowed_signers"
          git show "origin/$RELEASE_BRANCH:.github/allowed_signers" > "$signers" || {
            echo "::error::.github/allowed_signers is missing on $RELEASE_BRANCH"; exit 1; }
          # a tag without a pre-release suffix is what mainnet validators run
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$FINAL_RELEASE" = true ]; then
            # one key listed twice, or two keys under one name, is still one holder
            keys=$(awk '!/^[[:space:]]*(#|$)/ { for (i = 2; i < NF; i++) if ($i ~ /^(ssh-|ecdsa-|sk-)/) { print $(i + 1); break } }' "$signers" | sort -u | wc -l)
            principals=$(awk '!/^[[:space:]]*(#|$)/ { n = split($1, p, ","); for (i = 1; i <= n; i++) print p[i] }' "$signers" | sort -u | wc -l)
            holders=$(( keys < principals ? keys : principals ))
            echo "final release: $keys distinct keys, $principals distinct principals in allowed_signers on $RELEASE_BRANCH"
            [ "$holders" -ge "$REQUIRED_RELEASE_SIGNERS" ] || {
              echo "::error::a final release needs $REQUIRED_RELEASE_SIGNERS release signers in .github/allowed_signers on $RELEASE_BRANCH, found $holders; see docs/runbooks/release-signing-key.md"; exit 1; }
          fi
          git config gpg.ssh.allowedSignersFile "$signers"
          git verify-tag "$GITHUB_REF_NAME"
          # the node reports package.json's version, so a release must carry its own
          version=$(git show "$sha:package.json" | jq -r .version)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "::error::package.json version is $version at $sha; tag v$version, or set the version to ${GITHUB_REF_NAME#v} and merge that first"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.run }}
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build inputs from the commit, not from the clock
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.verify-tag.outputs.sha }}" ] || { echo "::error::checkout is not the verified commit"; exit 1; }
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "GIT_COMMIT_MESSAGE=$(git log -1 --format=%s)"
            echo "BUILT_AT=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
          } >> "$GITHUB_ENV"
      - name: Build without cache, file timestamps rewritten to the commit date
        run: |
          docker buildx build \
            --no-cache --provenance=false --sbom=false \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH \
            --build-arg GIT_COMMIT \
            --build-arg "GIT_BRANCH=$GITHUB_REF_NAME" \
            --build-arg GIT_COMMIT_MESSAGE \
            --build-arg GIT_DIRTY=false \
            --build-arg BUILT_AT \
            --output type=oci,dest=image.tar,rewrite-timestamp=true \
            .
          tar -xOf image.tar index.json > index.json
          [ "$(jq '.manifests | length' index.json)" = 1 ] || { echo "::error::expected exactly one manifest in the OCI index"; exit 1; }
          jq -r '.manifests[0].digest' index.json > digest.txt
          grep -Eqx 'sha256:[0-9a-f]{64}' digest.txt || { echo "::error::no image digest in the build output"; exit 1; }
          cat digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.run }}
          path: digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.run == 'a'
        with:
          name: image
          path: image.tar
          compression-level: 0

  verify-build:
    name: Both builds match
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.compare.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
      - id: compare
        run: |
          a=$(cat digest-a/digest.txt); b=$(cat digest-b/digest.txt)
          echo "build a: $a"; echo "build b: $b"
          # Two missing digests are equal strings; only real digests may match.
          for d in "$a" "$b"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build produced no valid digest: '$d'"; exit 1; }
          done
          [ "$a" = "$b" ] || { echo "::error::the two builds differ; the release is not reproducible"; exit 1; }
          echo "digest=$a" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish image and checksums
    needs: [verify-tag, verify-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image
      - name: Install skopeo
        run: sudo apt-get update -q && sudo apt-get install -y -q skopeo
      - name: Push the verified image by digest
        env:
          EXPECTED: ${{ needs.verify-build.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.verify-tag.outputs.sha }}" ] || { echo "::error::checkout is not the verified commit"; exit 1; }
          printf '%s' "$TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests --digestfile pushed.txt \
            oci-archive:image.tar "docker://$IMAGE:$GITHUB_REF_NAME"
          pushed=$(cat pushed.txt)
          [ "$pushed" = "$EXPECTED" ] || { echo "::error::pushed digest $pushed differs from the verified $EXPECTED"; exit 1; }
      - name: Source archive and checksums
        env:
          DIGEST: ${{ needs.verify-build.outputs.digest }}
        run: |
          git archive --format=tar --prefix="node-$GITHUB_REF_NAME/" HEAD > "node-$GITHUB_REF_NAME-src.tar"
          {
            echo "tag: $GITHUB_REF_NAME"
            echo "commit: $(git rev-parse HEAD)"
            echo "image: $IMAGE:$GITHUB_REF_NAME@$DIGEST"
            echo "source: $(sha256sum "node-$GITHUB_REF_NAME-src.tar")"
          } | tee checksums.txt
      - name: Draft the GitHub release with the checksums attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file checksums.txt \
            checksums.txt "node-$GITHUB_REF_NAME-src.tar"
