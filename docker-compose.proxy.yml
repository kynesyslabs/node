# =============================================================================
# Compose override — proxy mode (Epic 12 T13)
# =============================================================================
# Used together with docker-compose.yml when Caddy fronts all HTTP/WS routes.
# Drops every host port mapping that Caddy now serves, so a fresh
# `docker compose ps` only shows 80/443 (Caddy) + 53551 (OmniProtocol) +
# 9095 (gossip) + 7047 (TLSNotary direct mode only). OmniProtocol stays
# direct because its custom-fingerprint TLS cannot survive proxy
# termination; gossip is raw libp2p TCP, which Caddy does not forward.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml \
#       --profile proxy --profile monitoring --profile tlsnotary up -d
#
# Or, more convenient, via .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   COMPOSE_PROFILES=monitoring,tlsnotary,proxy
#
# Bare-metal deployments DO NOT use this file at all.
# =============================================================================

services:
  node:
    # The node refuses to boot while a basic-auth hash below is empty or still
    # the placeholder (src/config/proxyChecks.ts). Caddy gets its own copy of
    # the hashes in docker-compose.yml. PROXY_ALLOW_PLACEHOLDER_AUTH=true keeps
    # a route closed on purpose.
    environment:
      PROXY_ENABLED: "true"
      # Caddy connects from the docker bridge range. It drops the
      # X-Forwarded-For, X-Real-IP and CF-Connecting-IP headers clients send
      # and sets X-Forwarded-For itself, so the node reads the client address
      # Caddy saw. Clients Caddy itself sees from inside this range (IPv6 or
      # hairpin clients relayed by docker, hosts on a 172.16.0.0/12 network)
      # are counted as Caddy and share its rate-limit counter. The RPC port is
      # not published below, so only the host and containers on the network
      # reach the node's RPC from this range.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      PROXY_ALLOW_PLACEHOLDER_AUTH: ${PROXY_ALLOW_PLACEHOLDER_AUTH:-}
      METRICS_BASIC_AUTH_HASH: ${METRICS_BASIC_AUTH_HASH:-}
      MCP_BASIC_AUTH_HASH: ${MCP_BASIC_AUTH_HASH:-}
    # `!override` (Compose Spec, supported by Compose v2.20+) replaces
    # the parent's ports list with this one instead of unioning them.
    # Without it, Compose merges lists across files — leaves every host
    # port still published. OmniProtocol stays direct (custom-fingerprint
    # TLS cannot survive a proxy hop).
    ports: !override
      - "${OMNI_PORT:-53551}:${OMNI_PORT:-53551}"
      # Peers dial EXPOSED_URL's host on this port while gossip is enabled
      # (the default), and Caddy cannot carry libp2p TCP.
      - "${GOSSIP_PORT:-9095}:${GOSSIP_PORT:-9095}"

  prometheus:
    ports: !override []

  grafana:
    ports: !override []

  node-exporter:
    ports: !override []

  neo4j:
    # Bolt port stays internal-only in proxy mode; HTTP UI is reached via
    # Caddy if you add a route (not in default Caddyfile). Drop both.
    ports: !override []

  tlsnotary:
    # TLSNotary disposition depends on TLSNOTARY_PROXY_MODE. The default
    # subpath/subdomain modes proxy via Caddy — direct mode requires the
    # operator to flip back to docker-compose.yml's host mapping.
    ports: !override []
