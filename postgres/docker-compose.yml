services:
    db:
        container_name: postgres_${PG_PORT}
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        environment:
            POSTGRES_USER: demosuser
            POSTGRES_PASSWORD: demospassword
            PGDATA: /data/postgres
            POSTGRES_DB: demos
        volumes:
            - ./data_${PG_PORT}/postgres:/data/postgres
        ports:
            - "${PG_PORT}:5432"
        networks:
            - db
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U demosuser -d demos"]
            interval: 5s
            timeout: 5s
            retries: 5

    # app:
    #     depends_on:
    #         db:
    #             condition: service_healthy

networks:
    db:
        driver: bridge

volumes:
    db:
