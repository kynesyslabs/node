# REVIEW: Prometheus configuration for Demos Network node monitoring
#
# IMPORTANT: Port Distinction
# - METRICS_PORT (default 9090): The Demos node's metrics endpoint (configured in main .env)
# - PROMETHEUS_PORT (default 9091): This Prometheus server's external port (configured in monitoring/.env)
#
# Scrape configuration for collecting metrics from:
# - Demos node metrics endpoint (default port 9090, configurable via METRICS_PORT in main .env)
# - Node Exporter (optional, port 9100)
# - Prometheus self-monitoring

global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
        monitor: demos-network

# Alertmanager runs in monitoring/docker-compose.yml (service `alertmanager`).
# The unified root compose file has none, so Prometheus there only logs that
# the target is unreachable.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Alert rules (Epic 13 T14). Files under alerts/ are loaded at startup
# and reloaded on SIGHUP. Routing (Slack, paging, dead-man) is in monitoring/alertmanager/alertmanager.yml;
# see docs/runbooks/mainnet-monitoring.md.
rule_files:
  - alerts/*.yml

scrape_configs:
    # Prometheus self-monitoring
    - job_name: prometheus
      static_configs:
          - targets: [prometheus:9090]
      metrics_path: /metrics

    # Demos Network Node metrics
    # The node exposes metrics at /metrics endpoint on METRICS_PORT (default 9090)
    # NOTE: If you changed METRICS_PORT in your main .env file, update the target below to match
    # For example, if METRICS_PORT=3333, change the target to 'node:3333'
    - job_name: demos-node
      static_configs:
          - targets: [node:9090] # service name 'node' from unified docker-compose.yml; matches METRICS_PORT from .env
            labels:
                instance: local-node
                environment: development
      metrics_path: /metrics
      scrape_interval: 5s # More frequent for real-time monitoring
      scrape_timeout: 5s
      # With METRICS_BEARER_TOKEN set on the node, mount a file holding the
      # same token and uncomment:
      # authorization:
      #   credentials_file: /etc/prometheus/metrics_token

    # Optional public RPC watcher (--profile network); no validator metrics access.
    - job_name: demos-network-watcher
      static_configs:
          - targets: [network-watcher:9465]
      scrape_timeout: 5s

    # Node Exporter for host-level metrics (optional)
    # Only scraped if node-exporter is running (--profile full)
    - job_name: node-exporter
      static_configs:
          - targets: [node-exporter:9100]
            labels:
                instance: host
      metrics_path: /metrics
      scrape_interval: 15s

# Mainnet (multi-validator) setup. One monitoring host off the validators scrapes each
# validator on its PRIVATE address (the node's METRICS_BIND). In the demos-node job above,
# replace the single target with ONE static_configs entry PER VALIDATOR, each with its
# own `instance` name, and keep the job name demos-node so the alert rules match. A
# separate entry per validator is what makes NodeDown, HeightStalled and DiskSpaceLow fire
# for that validator alone instead of as one merged alert. The node-exporter job is
# optional (host metrics; no alert rule reads it). The addresses below are placeholders:
#
#     - job_name: demos-node
#       static_configs:
#           - targets: ['<VALIDATOR_1_PRIVATE_ADDR>:9090']
#             labels: {instance: validator-1, environment: mainnet}
#           - targets: ['<VALIDATOR_2_PRIVATE_ADDR>:9090']
#             labels: {instance: validator-2, environment: mainnet}
#           - targets: ['<VALIDATOR_3_PRIVATE_ADDR>:9090']
#             labels: {instance: validator-3, environment: mainnet}
#
#     - job_name: node-exporter     # one node-exporter per validator host, port 9100
#       static_configs:
#           - targets: ['<VALIDATOR_1_PRIVATE_ADDR>:9100']
#             labels: {instance: validator-1, environment: mainnet}
#           (same for validator-2, validator-3)
