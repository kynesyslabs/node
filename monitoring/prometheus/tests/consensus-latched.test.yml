# promtool unit tests for the demos-consensus-latched group in alerts/consensus.yml:
# ConflictingBlock, ForeignSignature and PrecommitEquivocation must keep firing after the
# counter stops moving, and expire only 7 days after the last event.
# In all three cases the series is: the event at minute 10, a node restart at minute 20
# (counter back to 0) and no scrape at all from minute 30 on, and each alert is checked
# to still fire 1 h or 2 h and 6 d later and to be gone 7 d 30 m later. ForeignSignature and PrecommitEquivocation are
# double-sign signals: each also has a case for not firing when no event happened.
# BlockHashMismatch is not latched; its tests are in consensus-blockhash.test.yml.
# Run: scripts/check-monitoring.sh
rule_files:
  - ../alerts/consensus.yml

# The rules run every 1 m in production. promtool caps a query at 10000 samples, and a
# 7 d range of 1 m samples is 10080, so the test evaluates every 5 m (input stays at 1 m).
evaluation_interval: 5m

tests:
  - interval: 1m
    input_series:
      # validator-1: one conflicting block at minute 10, the node is restarted at
      # minute 20 (counter back to 0) and from minute 30 it is not scraped at all.
      - series: 'demos_conflicting_block_total{job="demos-node",instance="validator-1"}'
        values: '0x9 1x9 0x9 _x12000'
      # validator-2: never saw a conflict.
      - series: 'demos_conflicting_block_total{job="demos-node",instance="validator-2"}'
        values: '0x12000'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConflictingBlock
        exp_alerts: []
      # One conflicting block: fires for validator-1 only.
      - eval_time: 15m
        alertname: ConflictingBlock
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Two blocks with a verified quorum existed at one height (latched)"
              description: "validator-1 held a block at some height while a peer served a different block there that carried a verified quorum, within the last 7 days. The node does not switch on its own. Search its log for [FORK] for the height and both hashes, then decide which chain to keep. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      # After the restart (counter reset to 0) and with the target no longer scraped
      # at all (minute 30 onwards): still firing 2 h and 6 d later.
      - eval_time: 2h
        alertname: ConflictingBlock
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Two blocks with a verified quorum existed at one height (latched)"
              description: "validator-1 held a block at some height while a peer served a different block there that carried a verified quorum, within the last 7 days. The node does not switch on its own. Search its log for [FORK] for the height and both hashes, then decide which chain to keep. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      - eval_time: 6d
        alertname: ConflictingBlock
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Two blocks with a verified quorum existed at one height (latched)"
              description: "validator-1 held a block at some height while a peer served a different block there that carried a verified quorum, within the last 7 days. The node does not switch on its own. Search its log for [FORK] for the height and both hashes, then decide which chain to keep. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      # One hour short of 7 days: still firing; one hour past: gone.
      - eval_time: 6d23h
        alertname: ConflictingBlock
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Two blocks with a verified quorum existed at one height (latched)"
              description: "validator-1 held a block at some height while a peer served a different block there that carried a verified quorum, within the last 7 days. The node does not switch on its own. Search its log for [FORK] for the height and both hashes, then decide which chain to keep. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      - eval_time: 7d1h
        alertname: ConflictingBlock
        exp_alerts: []
      # Expired 7 days after the event.
      - eval_time: 7d30m
        alertname: ConflictingBlock
        exp_alerts: []

  - interval: 1m
    input_series:
      # validator-1: a foreign signature at minute 10, the node is restarted at minute 20
      # (counter back to 0) and from minute 30 it is not scraped at all.
      - series: 'demos_foreign_signature_total{job="demos-node",instance="validator-1"}'
        values: '0x9 1x9 0x9 _x12000'
      # validator-2: never saw one.
      - series: 'demos_foreign_signature_total{job="demos-node",instance="validator-2"}'
        values: '0x12000'
    alert_rule_test:
      # Before the event: nothing.
      - eval_time: 5m
        alertname: ForeignSignature
        exp_alerts: []
      # The event: fires for validator-1 only (validator-2 is absent from the list).
      - eval_time: 15m
        alertname: ForeignSignature
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Another process is signing with this validator's key (latched)"
              description: "validator-1 saw a peer block carrying a signature by its own key that it never recorded, and stopped signing, within the last 7 days. Stop every copy of this key and find the second host; see docs/runbooks/validator-key.md. SigningHalted tracks whether the stop is still in force. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      # The condition has cleared (the 10 m window is empty; the old rule would have
      # resolved at minute ~21), the counter was reset by the restart and the target is no
      # longer scraped: still firing 1 h and 6 d later.
      - eval_time: 1h
        alertname: ForeignSignature
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Another process is signing with this validator's key (latched)"
              description: "validator-1 saw a peer block carrying a signature by its own key that it never recorded, and stopped signing, within the last 7 days. Stop every copy of this key and find the second host; see docs/runbooks/validator-key.md. SigningHalted tracks whether the stop is still in force. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      - eval_time: 6d
        alertname: ForeignSignature
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Another process is signing with this validator's key (latched)"
              description: "validator-1 saw a peer block carrying a signature by its own key that it never recorded, and stopped signing, within the last 7 days. Stop every copy of this key and find the second host; see docs/runbooks/validator-key.md. SigningHalted tracks whether the stop is still in force. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      # One hour short of 7 days: still firing; one hour past: gone.
      - eval_time: 6d23h
        alertname: ForeignSignature
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "Another process is signing with this validator's key (latched)"
              description: "validator-1 saw a peer block carrying a signature by its own key that it never recorded, and stopped signing, within the last 7 days. Stop every copy of this key and find the second host; see docs/runbooks/validator-key.md. SigningHalted tracks whether the stop is still in force. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      - eval_time: 7d1h
        alertname: ForeignSignature
        exp_alerts: []
      # Expired 7 days after the event.
      - eval_time: 7d30m
        alertname: ForeignSignature
        exp_alerts: []

  - interval: 1m
    input_series:
      # validator-1: one equivocation at minute 10, the node is restarted at minute 20
      # (counter back to 0) and from minute 30 it is not scraped at all.
      - series: 'demos_precommit_equivocation_total{job="demos-node",instance="validator-1"}'
        values: '0x9 1x9 0x9 _x12000'
      # validator-2: never saw one.
      - series: 'demos_precommit_equivocation_total{job="demos-node",instance="validator-2"}'
        values: '0x12000'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrecommitEquivocation
        exp_alerts: []
      # The event: fires for validator-1 only.
      - eval_time: 15m
        alertname: PrecommitEquivocation
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "A committee member precommitted two blocks in one round (latched)"
              description: "validator-1 received precommits from one member for two different blocks at the same height and round, within the last 7 days. Search its log for [commitLock] Equivocation for the member, the height and both signatures. The member's key is running twice or its signing state was rolled back. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      # After the restart and with the target no longer scraped: still firing 1 h and 6 d later.
      - eval_time: 1h
        alertname: PrecommitEquivocation
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "A committee member precommitted two blocks in one round (latched)"
              description: "validator-1 received precommits from one member for two different blocks at the same height and round, within the last 7 days. Search its log for [commitLock] Equivocation for the member, the height and both signatures. The member's key is running twice or its signing state was rolled back. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      - eval_time: 6d
        alertname: PrecommitEquivocation
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "A committee member precommitted two blocks in one round (latched)"
              description: "validator-1 received precommits from one member for two different blocks at the same height and round, within the last 7 days. Search its log for [commitLock] Equivocation for the member, the height and both signatures. The member's key is running twice or its signing state was rolled back. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      # One hour short of 7 days: still firing; one hour past: gone.
      - eval_time: 6d23h
        alertname: PrecommitEquivocation
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: "A committee member precommitted two blocks in one round (latched)"
              description: "validator-1 received precommits from one member for two different blocks at the same height and round, within the last 7 days. Search its log for [commitLock] Equivocation for the member, the height and both signatures. The member's key is running twice or its signing state was rolled back. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."
      - eval_time: 7d1h
        alertname: PrecommitEquivocation
        exp_alerts: []
      # Expired 7 days after the event.
      - eval_time: 7d30m
        alertname: PrecommitEquivocation
        exp_alerts: []

  # No event at all on either counter: neither alert fires, at any time.
  - interval: 1m
    input_series:
      - series: 'demos_foreign_signature_total{job="demos-node",instance="validator-1"}'
        values: '0x12000'
      - series: 'demos_precommit_equivocation_total{job="demos-node",instance="validator-1"}'
        values: '0x12000'
    alert_rule_test:
      - eval_time: 15m
        alertname: ForeignSignature
        exp_alerts: []
      - eval_time: 1h
        alertname: ForeignSignature
        exp_alerts: []
      - eval_time: 6d
        alertname: ForeignSignature
        exp_alerts: []
      - eval_time: 15m
        alertname: PrecommitEquivocation
        exp_alerts: []
      - eval_time: 1h
        alertname: PrecommitEquivocation
        exp_alerts: []
      - eval_time: 6d
        alertname: PrecommitEquivocation
        exp_alerts: []
