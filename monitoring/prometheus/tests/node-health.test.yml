# promtool unit tests for alerts/node-health.yml: NodeDown per validator and DeadMansSwitch.
# The other rules in that file are tested in alerts.test.yml.
# Run: scripts/check-monitoring.sh
rule_files:
  - ../alerts/node-health.yml

evaluation_interval: 1m

tests:
  # NodeDown: one validator down fires its own alert, carrying its own instance label.
  - interval: 1m
    input_series:
      - series: 'up{job="demos-node",instance="validator-1"}'
        values: '1x3 0x20'
      - series: 'up{job="demos-node",instance="validator-2"}'
        values: '1x23'
      # validator-3 misses a single scrape: shorter than the 1 m `for`.
      - series: 'up{job="demos-node",instance="validator-3"}'
        values: '1x5 0 1x17'
    alert_rule_test:
      # validator-1 went down at minute 4: pending after one evaluation, firing after 1 m.
      - eval_time: 5m
        alertname: NodeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: Demos node is down
              description: "Prometheus failed to scrape validator-1 for >1m. The node may have crashed or its metrics server is unreachable."
      - eval_time: 15m
        alertname: NodeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: Demos node is down
              description: "Prometheus failed to scrape validator-1 for >1m. The node may have crashed or its metrics server is unreachable."
      # validator-3 is down at minute 6 only (one scrape): pending, so without `for: 1m`
      # it would fire here next to validator-1.
      - eval_time: 6m
        alertname: NodeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: Demos node is down
              description: "Prometheus failed to scrape validator-1 for >1m. The node may have crashed or its metrics server is unreachable."
      # Before anything is down.
      - eval_time: 3m
        alertname: NodeDown
        exp_alerts: []

  # DeadMansSwitch: always firing, with no input at all.
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: DeadMansSwitch
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: Alerting pipeline heartbeat
              description: This alert is always firing. If the external watchdog stops receiving it, Prometheus, Alertmanager or the dead-man receiver path is broken. It does not prove that the paging or Slack webhooks work.
      - eval_time: 3h
        alertname: DeadMansSwitch
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: Alerting pipeline heartbeat
              description: This alert is always firing. If the external watchdog stops receiving it, Prometheus, Alertmanager or the dead-man receiver path is broken. It does not prove that the paging or Slack webhooks work.

  # NodeFailing in fast sync: src/index.ts marks main_loop running only after the boot-time
  # fast sync, so main_loop is up=0, skipped=0 for the whole catch-up. Fast sync is still
  # running (1) for 10 minutes: no alert.
  - interval: 1m
    input_series:
      - series: 'demos_subsystem_up{subsystem="main_loop",instance="validator-1"}'
        values: '0x15'
      - series: 'demos_subsystem_skipped{subsystem="main_loop",instance="validator-1"}'
        values: '0x15'
      - series: 'demos_boot_step_status{step="fast_sync",instance="validator-1"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeFailing
        exp_alerts: []

  # NodeFailing after fast sync: it finishes at minute 5 and main_loop is still down, so
  # the alert goes pending then and fires 2 m later.
  - interval: 1m
    input_series:
      - series: 'demos_subsystem_up{subsystem="main_loop",instance="validator-1"}'
        values: '0x15'
      - series: 'demos_subsystem_skipped{subsystem="main_loop",instance="validator-1"}'
        values: '0x15'
      - series: 'demos_boot_step_status{step="fast_sync",instance="validator-1"}'
        values: '1x4 2x11'
    alert_rule_test:
      - eval_time: 6m
        alertname: NodeFailing
        exp_alerts: []
      - eval_time: 9m
        alertname: NodeFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              subsystem: main_loop
              instance: validator-1
            exp_annotations:
              summary: Main loop is dead
              description: 'demos_subsystem_up{subsystem="main_loop"} has been 0 for >2m on validator-1 and the subsystem was not intentionally skipped. The node is serving RPC but is no longer producing blocks. Check `/health.main_loop.exit_reason` and recent logs.'

  # MainLoopHeartbeatStale: heartbeat age over 120 s held 1 m, kept firing 5 m after it clears.
  - interval: 1m
    input_series:
      # validator-1: the loop is stuck from minute 3 to 8 (age 200 s), then recovers.
      - series: 'demos_main_loop_heartbeat_seconds{job="demos-node",instance="validator-1"}'
        values: '10x3 200x5 10x12'
      # validator-2: healthy.
      - series: 'demos_main_loop_heartbeat_seconds{job="demos-node",instance="validator-2"}'
        values: '10x20'
    alert_rule_test:
      # Over the threshold for under 1 m: pending only.
      - eval_time: 3m
        alertname: MainLoopHeartbeatStale
        exp_alerts: []
      - eval_time: 6m
        alertname: MainLoopHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: mainLoop heartbeat stale
              description: "demos_main_loop_heartbeat_seconds = 200 on validator-1. Loop is running slowly or stuck."
      # Recovered at minute 9, still held by keep_firing_for (5 m) 3 m later (the value is
      # the last firing one), gone 7 m later.
      - eval_time: 12m
        alertname: MainLoopHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: mainLoop heartbeat stale
              description: "demos_main_loop_heartbeat_seconds = 200 on validator-1. Loop is running slowly or stuck."
      - eval_time: 16m
        alertname: MainLoopHeartbeatStale
        exp_alerts: []

  # PeersZero: the node counts itself, so the gauge is 1 when every real peer is gone.
  - interval: 1m
    input_series:
      # validator-1: alone for the whole run (count 1): fires after the 5 m `for`.
      - series: 'demos_peer_online_count{job="demos-node",instance="validator-1"}'
        values: '1x20'
      # validator-2: one real peer online (count 2): never fires.
      - series: 'demos_peer_online_count{job="demos-node",instance="validator-2"}'
        values: '2x20'
      # validator-3: alone until minute 7, then three peers return; kept firing for 5 m.
      - series: 'demos_peer_online_count{job="demos-node",instance="validator-3"}'
        values: '1x7 4x13'
    alert_rule_test:
      # Alone for under 5 m: pending only.
      - eval_time: 4m
        alertname: PeersZero
        exp_alerts: []
      # validator-1 fires at minute 5. validator-3 fired at minute 5 too and its peers came
      # back at minute 7, but keep_firing_for (5 m) still holds it at minute 10.
      # validator-2 has a real peer and never appears.
      - eval_time: 10m
        alertname: PeersZero
        exp_alerts:
          - exp_labels:
              severity: warning
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: No connected peers (only the node itself is online)
              description: "demos_peer_online_count has been 1 or less for >5m on validator-1. The count includes the node itself, so 1 means no other peer is online. Check network egress + bootstrap peer list."
          - exp_labels:
              severity: warning
              job: demos-node
              instance: validator-3
            exp_annotations:
              summary: No connected peers (only the node itself is online)
              description: "demos_peer_online_count has been 1 or less for >5m on validator-3. The count includes the node itself, so 1 means no other peer is online. Check network egress + bootstrap peer list."
      # validator-3 is released by minute 14; validator-1 is still alone.
      - eval_time: 14m
        alertname: PeersZero
        exp_alerts:
          - exp_labels:
              severity: warning
              job: demos-node
              instance: validator-1
            exp_annotations:
              summary: No connected peers (only the node itself is online)
              description: "demos_peer_online_count has been 1 or less for >5m on validator-1. The count includes the node itself, so 1 means no other peer is online. Check network egress + bootstrap peer list."
