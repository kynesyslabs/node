# Consensus-health alerts for mainnet validators. Delivered through the
# Alertmanager in monitoring/docker-compose.yml; see docs/runbooks/mainnet-monitoring.md.
groups:
  - name: demos-consensus
    rules:
      - alert: HeightStalled
        expr: demos_seconds_since_last_block > 300
        for: 2m
        # A block that slips through a stalled network resets the gauge, and it
        # needs over 300s to cross the threshold again. Hold longer than that
        # plus scrape and evaluation lag so the alert does not resolve and re-page.
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: No new block for over 5 minutes
          description: "demos_seconds_since_last_block = {{ $value }} on {{ $labels.instance }}. If the whole network has stalled this fires on EVERY validator at once; the block watchdog is off on purpose, this alert is what replaces it. Check whether peers are at the same height before acting on one node."

      # BlockHashMismatch and ConflictingBlock are in the demos-consensus-latched
      # group at the end of this file.

      # ForeignSignature and PrecommitEquivocation are in the demos-consensus-latched
      # group at the end of this file.

      - alert: SigningHalted
        expr: demos_signing_halted == 1
        labels:
          severity: critical
        annotations:
          summary: Block signing is stopped on this validator
          description: "{{ $labels.instance }} refuses to sign blocks; its log has a [SIGNING] or [IDENTITY] line with the reason. The stop survives a restart only while the marker file exists (demos_signing_halt_marker_present = 1). If the marker is missing, the marker write failed: keep the node stopped until every other copy of the key is found and stopped, because a restart would sign again. Delete the marker only after confirming a single copy of the key runs; see docs/runbooks/validator-key.md."

      - alert: MissedSignatures
        expr: increase(demos_consensus_missed_signatures_total[15m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: Validator was drawn into the shard but its signature is missing
          description: "{{ $value }} blocks in 15m where {{ $labels.instance }} was selected for the shard and did not sign. The node is online but not taking part in consensus: check sync state and peer connectivity."

      - alert: StorageRootSyncMismatch
        expr: increase(demos_storage_root_sync_mismatch_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Synced storage state differs from the network's
          description: "{{ $labels.instance }} synced a block whose storage state root differs from the root of its own storage-program table. Sync carries on, but the node's storage state has diverged and its block votes will not match. Search its log for [syncVerify] storage root, then resync the node from a trusted snapshot."

      - alert: ForkScheduleMismatch
        expr: demos_fork_schedule_mismatch == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A peer has a different fork schedule
          description: "{{ $labels.instance }} found a validator whose fork schedule differs from its own. Compare genesis.json with the published release; see docs/runbooks/fork-schedule-policy.md."

      - alert: ConsensusAbstaining
        expr: demos_consensus_abstaining == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Validator is sitting out consensus because of a fork schedule mismatch
          description: "{{ $labels.instance }} skips forging and voting because most validators report a different fork schedule than its own. It keeps syncing and resumes once no majority differs. Confirm its genesis.json against the published hash first: if the majority is the one with the wrong schedule, this node is on the right side. See docs/runbooks/fork-schedule-policy.md."

      - alert: ClockOffset
        # Measured every 10 minutes, so 15m means two readings in a row
        expr: abs(demos_clock_offset_seconds) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Validator host clock is off from NTP
          description: "The host clock of {{ $labels.instance }} is {{ $value }}s off from the median of public NTP servers. Members refuse blocks stamped more than 5s ahead of their clock, so fix the host's NTP service (chronyc tracking or timedatectl) before it reaches that. demos_clock_probe_agreeing_servers below 2 means the reading is stale; see docs/runbooks/mainnet-monitoring.md."

      - alert: MempoolBacklog
        # Plain number, not derived from config: keep it below the mempool hard cap
        # so the alert fires before the pool starts rejecting transactions.
        expr: demos_mempool_size > 8000
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: Mempool backlog is large
          description: "demos_mempool_size = {{ $value }} on {{ $labels.instance }} for over 5m. Blocks are not draining the pool, or a flood is in progress."

  # Latched fork alerts. A fork is not over when the counter stops moving, so these
  # must not resolve on their own after a few minutes. Method: a recording rule keeps
  # the 10 m burst size as its own series, and the alert is the maximum of that series
  # over the last 7 days. Once the condition has been true the alert stays firing for 7 d,
  # whatever the node does afterwards (restart, crash, stop being scraped).
  #
  # Clearing (see docs/runbooks/mainnet-monitoring.md, "Clearing a latched alert"):
  #   1. Acknowledge: create an Alertmanager silence for the alert and instance, with the
  #      ticket in the comment. The alert stays visible in Prometheus as firing.
  #   2. Clear: once the fork is resolved and at least 10 m after the last event, delete
  #      the recorded series for that instance (admin API, off by default), e.g.
  #      match[]=demos:conflicting_block:increase10m{instance="validator-2"}. The counter
  #      itself is left alone, so the evidence stays in the TSDB.
  #   3. Otherwise it expires by itself 7 d after the last event.
  # Only metrics the node exports today are used. ForeignSignature and
  # PrecommitEquivocation are double-sign signals and are latched the same way, with
  # the same 7 d window and the same clear procedure (their recorded series are
  # demos:foreign_signature:increase10m and demos:precommit_equivocation:increase10m).
  - name: demos-consensus-latched
    interval: 1m
    rules:
      - record: demos:consensus_block_hash_mismatch:increase10m
        expr: increase(demos_consensus_block_hash_mismatch_total[10m])

      - record: demos:conflicting_block:increase10m
        expr: increase(demos_conflicting_block_total[10m])

      - record: demos:foreign_signature:increase10m
        expr: increase(demos_foreign_signature_total[10m])

      - record: demos:precommit_equivocation:increase10m
        expr: increase(demos_precommit_equivocation_total[10m])

      - alert: BlockHashMismatch
        # No `for`: the old 5 m `for` only checked that the 10 m window still held the
        # burst, and a latch holds it for 7 d anyway.
        expr: max_over_time(demos:consensus_block_hash_mismatch:increase10m[7d]) > 3
        labels:
          severity: warning
        annotations:
          summary: Peers disagreed with this node's candidate block hash (latched)
          description: "Up to {{ $value }} peer disagreements on the candidate block hash within 10m on {{ $labels.instance }} during the last 7 days. This node, or the peers, forged different block content. This alert does not resolve by itself: check the mempool, clock skew and the node logs for the tx-set diff, then clear it as described in docs/runbooks/mainnet-monitoring.md."

      - alert: ConflictingBlock
        expr: max_over_time(demos:conflicting_block:increase10m[7d]) > 0
        labels:
          severity: critical
        annotations:
          summary: Two blocks with a verified quorum existed at one height (latched)
          description: "{{ $labels.instance }} held a block at some height while a peer served a different block there that carried a verified quorum, within the last 7 days. The node does not switch on its own. Search its log for [FORK] for the height and both hashes, then decide which chain to keep. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."

      - alert: ForeignSignature
        expr: max_over_time(demos:foreign_signature:increase10m[7d]) > 0
        labels:
          severity: critical
        annotations:
          summary: Another process is signing with this validator's key (latched)
          description: "{{ $labels.instance }} saw a peer block carrying a signature by its own key that it never recorded, and stopped signing, within the last 7 days. Stop every copy of this key and find the second host; see docs/runbooks/validator-key.md. SigningHalted tracks whether the stop is still in force. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."

      - alert: PrecommitEquivocation
        expr: max_over_time(demos:precommit_equivocation:increase10m[7d]) > 0
        labels:
          severity: critical
        annotations:
          summary: A committee member precommitted two blocks in one round (latched)
          description: "{{ $labels.instance }} received precommits from one member for two different blocks at the same height and round, within the last 7 days. Search its log for [commitLock] Equivocation for the member, the height and both signatures. The member's key is running twice or its signing state was rolled back. This alert does not resolve by itself; clear it as described in docs/runbooks/mainnet-monitoring.md."

  # SEAM kynesyslabs/node#1084: rules from that PR plug in as their own file under
  # alerts/ (loaded by the alerts/*.yml glob) with its own group names, so nothing
  # here needs to move. Do not reuse the alert names in this directory.
