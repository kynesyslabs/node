# Consensus-health alerts for mainnet validators. Delivered through the
# Alertmanager in monitoring/docker-compose.yml; see docs/runbooks/mainnet-monitoring.md.
groups:
  - name: demos-consensus
    rules:
      - alert: HeightStalled
        expr: demos_seconds_since_last_block > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No new block for over 5 minutes
          description: "demos_seconds_since_last_block = {{ $value }} on {{ $labels.instance }}. If the whole network has stalled this fires on EVERY validator at once; the block watchdog is off on purpose, this alert is what replaces it. Check whether peers are at the same height before acting on one node."

      - alert: BlockHashMismatch
        expr: increase(demos_consensus_block_hash_mismatch_total[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Peers disagree with this node's candidate block hash
          description: "{{ $value }} peer disagreements on the candidate block hash in 10m on {{ $labels.instance }}. This node, or the peers, are forging different block content. Check the mempool, clock skew and the node logs for the tx-set diff."

      - alert: ConflictingBlock
        expr: increase(demos_conflicting_block_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Two blocks with a verified quorum exist at one height
          description: "{{ $labels.instance }} holds a block at some height while a peer serves a different block there that carries a verified quorum. The node does not switch on its own. Search its log for [FORK] for the height and both hashes, then decide which chain to keep."

      - alert: ForeignSignature
        expr: increase(demos_foreign_signature_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Another process is signing with this validator's key
          description: "{{ $labels.instance }} saw a peer block carrying a signature by its own key that it never recorded, and stopped signing. Stop every copy of this key and find the second host; see docs/runbooks/validator-key.md. SigningHalted tracks whether the stop is still in force."

      - alert: SigningHalted
        expr: demos_signing_halted == 1
        labels:
          severity: critical
        annotations:
          summary: Block signing is stopped on this validator
          description: "{{ $labels.instance }} refuses to sign blocks; its log has a [SIGNING] or [IDENTITY] line with the reason. The stop survives a restart only while the marker file exists (demos_signing_halt_marker_present = 1). If the marker is missing, the marker write failed: keep the node stopped until every other copy of the key is found and stopped, because a restart would sign again. Delete the marker only after confirming a single copy of the key runs; see docs/runbooks/validator-key.md."

      - alert: PrecommitEquivocation
        expr: increase(demos_precommit_equivocation_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A committee member precommitted two blocks in one round
          description: "{{ $labels.instance }} received precommits from one member for two different blocks at the same height and round. Search its log for [commitLock] Equivocation for the member, the height and both signatures. The member's key is running twice or its signing state was rolled back."

      - alert: MissedSignatures
        expr: increase(demos_consensus_missed_signatures_total[15m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: Validator was drawn into the shard but its signature is missing
          description: "{{ $value }} blocks in 15m where {{ $labels.instance }} was selected for the shard and did not sign. The node is online but not taking part in consensus: check sync state and peer connectivity."

      - alert: ForkScheduleMismatch
        expr: demos_fork_schedule_mismatch == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A peer has a different fork schedule
          description: "{{ $labels.instance }} found a validator whose fork schedule differs from its own. Compare genesis.json with the published release; see docs/runbooks/fork-schedule-policy.md."

      - alert: ConsensusAbstaining
        expr: demos_consensus_abstaining == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Validator is sitting out consensus because of a fork schedule mismatch
          description: "{{ $labels.instance }} skips forging and voting because most validators report a different fork schedule than its own. It keeps syncing and resumes once no majority differs. Confirm its genesis.json against the published hash first: if the majority is the one with the wrong schedule, this node is on the right side. See docs/runbooks/fork-schedule-policy.md."

      - alert: MempoolBacklog
        # Plain number, not derived from config: keep it below the mempool hard cap
        # so the alert fires before the pool starts rejecting transactions.
        expr: demos_mempool_size > 8000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mempool backlog is large
          description: "demos_mempool_size = {{ $value }} on {{ $labels.instance }} for over 5m. Blocks are not draining the pool, or a flood is in progress."
