# Alertmanager for the Demos monitoring stack. Three receivers, none of them with a URL
# in this repo: each URL is read from a file (compose secret, see monitoring/secrets/README.md):
#   slack   - everything except the heartbeat: critical and page (copy of the page),
#             warnings and info          <- /run/secrets/slack_webhook  (<SLACK_WEBHOOK_URL_PLACEHOLDER>)
#   paging  - critical and page, also sent to slack <- /run/secrets/pager_webhook  (<PAGER_WEBHOOK_URL_PLACEHOLDER>)
#   deadman - the always-firing heartbeat <- /run/secrets/deadman_webhook (<DEADMAN_WEBHOOK_URL_PLACEHOLDER>)
global:
  resolve_timeout: 5m

route:
  receiver: slack
  # One notification per alert name and validator, so a network-wide stall
  # arrives as one message per node but a flapping alert does not repeat.
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # SEAM kynesyslabs/node#1084: routes for rules from that PR go here, below the
    # dead-man route and above the severity routes, matching on its own alertnames/labels.

    # Heartbeat first, so no severity route can catch it. Re-sent every minute so the
    # external watchdog sees it stop quickly.
    - matchers:
        - alertname="DeadMansSwitch"
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # Critical (or an explicit `page`) wakes someone up AND is posted to Slack. The
    # paging route has `continue: true`, so matching goes on to the next route, which
    # sends the same alert to Slack. Keep the two routes adjacent and in this order.
    - matchers:
        - severity=~"critical|page"
      receiver: paging
      continue: true
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity=~"critical|page"
      receiver: slack
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: slack
      repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: |-
          {{ range .Alerts }}*{{ .Labels.instance }}*: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
  # Paging: a generic webhook so any pager can sit behind it. For PagerDuty use
  # `pagerduty_configs` with `routing_key_file` instead; same secret-file pattern.
  - name: paging
    webhook_configs:
      - url_file: /run/secrets/pager_webhook
        send_resolved: true
  # Dead-man's switch: an external watchdog that alerts when this stops arriving.
  - name: deadman
    webhook_configs:
      - url_file: /run/secrets/deadman_webhook
        send_resolved: false
