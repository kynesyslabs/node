# L2PS settlement end-to-end stack: postgres + 4 validators, driven only by
# run.sh, which sets every ${VAR} below through a per-run env file.
#
# node-1 and node-2 are members of the run's subnet (its key and IV are
# mounted into data/l2ps); node-3 and node-4 are not and see only what L1
# carries. Built for a shared host, after ../devnet/consensus-race:
#   - no container_name and a per-run compose project, so teardown
#     (`down -v`) touches only this stack;
#   - postgres data and each node's state dir on tmpfs, no named volumes;
#   - memory caps on every container; members get room for one prover
#     subprocess (about 4 GB while it proves);
#   - RPC published on 127.0.0.1 only.

x-node-env: &node-env
  NODE_ENV: development
  LOG_LEVEL: info
  L2PS_HASH_RELAY_NON_PROD: "true"
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_USER: demosuser
  PG_PASSWORD: demospass
  CONSENSUS_TIME: "${CONSENSUS_TIME}"
  TLSNOTARY_ENABLED: "false"
  L2PS_MESSAGING_ENABLED: "false"
  L2PS_ZK_ENABLED: "false"
  L2PS_SETTLEMENT_PROVERS: "${SETTLEMENT_PROVERS}"
  IDENTITY_FILE: /app/state/node.identity

x-node: &node
  image: ${E2E_IMAGE}
  # The identity is copied into a tmpfs state dir so the node's identity lock
  # and signing record stay inside the container and nothing root-owned is
  # left in the run dir. A readable stdin keeps the node from exiting at boot.
  entrypoint:
    - bash
    - -lc
    - mkdir -p /app/state && cp /app/keys/node.identity /app/state/node.identity && exec ./testing/devnet/run-devnet < /dev/null
  # A node that cannot pair with the anchor at a cold boot exits with code 0;
  # it is restarted until the mesh forms. `down -v` stops it regardless.
  restart: unless-stopped
  tmpfs:
    - /app/state
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - e2enet

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    mem_limit: 1g
    memswap_limit: 1g
    restart: "no"
    environment:
      POSTGRES_USER: demosuser
      POSTGRES_PASSWORD: demospass
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../devnet/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demosuser -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - e2enet

  node-1:
    <<: *node
    hostname: node1-host
    mem_limit: ${MEMBER_MEM}
    memswap_limit: ${MEMBER_MEM}
    environment:
      <<: *node-env
      PG_DATABASE: node1_db
      PORT: "53551"
      OMNI_PORT: "53552"
      EXPOSED_URL: http://node-1:53551
    ports:
      - "127.0.0.1:${RPC_PORT_1}:53551"
    volumes:
      - ${RUN_DIR}/inputs/node1.identity:/app/keys/node.identity:ro
      - ${RUN_DIR}/inputs/peerlist.json:/app/demos_peerlist.json:ro
      - ${RUN_DIR}/inputs/genesis.json:/app/data/genesis.json:ro
      - ${RUN_DIR}/inputs/empty-snapshot:/app/data/snapshot:ro
      - ${RUN_DIR}/inputs/l2ps-member:/app/data/l2ps:ro

  node-2:
    <<: *node
    hostname: node2-host
    mem_limit: ${MEMBER_MEM}
    memswap_limit: ${MEMBER_MEM}
    environment:
      <<: *node-env
      PG_DATABASE: node2_db
      PORT: "53553"
      OMNI_PORT: "53554"
      EXPOSED_URL: http://node-2:53553
    ports:
      - "127.0.0.1:${RPC_PORT_2}:53553"
    volumes:
      - ${RUN_DIR}/inputs/node2.identity:/app/keys/node.identity:ro
      - ${RUN_DIR}/inputs/peerlist.json:/app/demos_peerlist.json:ro
      - ${RUN_DIR}/inputs/genesis.json:/app/data/genesis.json:ro
      - ${RUN_DIR}/inputs/empty-snapshot:/app/data/snapshot:ro
      - ${RUN_DIR}/inputs/l2ps-member:/app/data/l2ps:ro

  node-3:
    <<: *node
    hostname: node3-host
    mem_limit: ${NODE_MEM}
    memswap_limit: ${NODE_MEM}
    environment:
      <<: *node-env
      PG_DATABASE: node3_db
      PORT: "53555"
      OMNI_PORT: "53556"
      EXPOSED_URL: http://node-3:53555
    ports:
      - "127.0.0.1:${RPC_PORT_3}:53555"
    volumes:
      - ${RUN_DIR}/inputs/node3.identity:/app/keys/node.identity:ro
      - ${RUN_DIR}/inputs/peerlist.json:/app/demos_peerlist.json:ro
      - ${RUN_DIR}/inputs/genesis.json:/app/data/genesis.json:ro
      - ${RUN_DIR}/inputs/empty-snapshot:/app/data/snapshot:ro
      - ${RUN_DIR}/inputs/l2ps-none:/app/data/l2ps:ro

  node-4:
    <<: *node
    hostname: node4-host
    mem_limit: ${NODE_MEM}
    memswap_limit: ${NODE_MEM}
    environment:
      <<: *node-env
      PG_DATABASE: node4_db
      PORT: "53557"
      OMNI_PORT: "53558"
      EXPOSED_URL: http://node-4:53557
    ports:
      - "127.0.0.1:${RPC_PORT_4}:53557"
    volumes:
      - ${RUN_DIR}/inputs/node4.identity:/app/keys/node.identity:ro
      - ${RUN_DIR}/inputs/peerlist.json:/app/demos_peerlist.json:ro
      - ${RUN_DIR}/inputs/genesis.json:/app/data/genesis.json:ro
      - ${RUN_DIR}/inputs/empty-snapshot:/app/data/snapshot:ro
      - ${RUN_DIR}/inputs/l2ps-none:/app/data/l2ps:ro

networks:
  e2enet:
    driver: bridge
