# Override: run the image with a source tree's src/ mounted read-only over
# the image's /app/src, to test code changes without rebuilding the image.
# The tree must stay dependency-compatible with the image's node_modules.
# run.sh adds this file when --src (or SRC_TREE) is given.

services:
  node-1:
    volumes:
      - ${SRC_TREE}/src:/app/src:ro
  node-2:
    volumes:
      - ${SRC_TREE}/src:/app/src:ro
  node-3:
    volumes:
      - ${SRC_TREE}/src:/app/src:ro
  node-4:
    volumes:
      - ${SRC_TREE}/src:/app/src:ro
